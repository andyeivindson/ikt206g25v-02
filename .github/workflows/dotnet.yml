name: .NET Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'  # 👈 or '8.0.x' if you're using net8.0

    - name: Restore dependencies
      run: dotnet restore ./StringLibrary.sln


    - name: Build
      run: dotnet build ./StringLibrary.sln --no-restore


    - name: Run tests
      run: dotnet test ./StringLibrary.sln --no-build --verbosity normal


